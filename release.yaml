# yaml-language-server: $schema=https://raw.githubusercontent.com/ravitejakamalapuram/release-platform/main/schema/release.schema.json
# Release contract for ravitejakamalapuram/release-platform@v2 (keyless Chrome Web Store publishing).
# The repo root is the extension; `include` is an allowlist so store assets, docs and
# scripts/ never ship. verses.js is generated by scripts/build-verses.py and committed.
app: gitaverses
targets:
  - type: chrome
    item_id: hebmlallhbgfnjjcnilphllknhfoddnk
    path: .
    include:
      - manifest.json
      - newtab.html
      - newtab.css
      - newtab.js
      - verses.js
      - images # backgrounds referenced from newtab.css
      - icons/icon-16.png
      - icons/icon-48.png
      - icons/icon-128.png # icon-512.png is a store asset, not referenced at runtime
